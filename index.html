<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cream Analog Clock</title>

  <style>
    :root {
      --background: #f7f2e8;
      --face: #fffaf1;
      --text: #4c4036;
      --muted: #9b8978;
      --accent: #b9835a;
      --border: #ded1bf;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .card {
      width: min(100%, 310px);
      min-height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(76, 64, 54, 0.06);
    }

    .clock {
      position: relative;
      width: 220px;
      height: 220px;
      background: var(--face);
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow: inset 0 0 0 7px rgba(222, 209, 191, 0.18);
    }

    .mark {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 2px;
      height: 9px;
      background: var(--muted);
      border-radius: 2px;
      transform-origin: 50% 101px;
    }

    .mark.major {
      width: 3px;
      height: 14px;
      background: var(--text);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      border-radius: 20px;
      transform-origin: 50% 100%;
    }

    .hour {
      width: 6px;
      height: 56px;
      margin-left: -3px;
      background: var(--text);
    }

    .minute {
      width: 4px;
      height: 76px;
      margin-left: -2px;
      background: var(--text);
    }

    .second {
      width: 2px;
      height: 82px;
      margin-left: -1px;
      background: var(--accent);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      margin: -6px;
      background: var(--accent);
      border: 3px solid var(--face);
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .label {
      position: absolute;
      top: 63px;
      right: 0;
      left: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }

    .date {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <section class="card" aria-label="Current local time">
    <div class="clock" id="clock">
      <div class="label">Local time</div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center"></div>
    </div>

    <div class="date" id="date">Loading date…</div>
  </section>

  <script>
    const clock = document.getElementById("clock");

    for (let number = 0; number < 12; number++) {
      const mark = document.createElement("span");

      mark.className = number % 3 === 0 ? "mark major" : "mark";
      mark.style.transform =
        `translateX(-50%) rotate(${number * 30}deg)`;

      clock.insertBefore(mark, clock.firstChild);
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      document.getElementById("hour").style.transform =
        `rotate(${hours * 30 + minutes * 0.5}deg)`;

      document.getElementById("minute").style.transform =
        `rotate(${minutes * 6 + seconds * 0.1}deg)`;

      document.getElementById("second").style.transform =
        `rotate(${seconds * 6}deg)`;

      document.getElementById("date").textContent =
        new Intl.DateTimeFormat(undefined, {
          weekday: "long",
          day: "numeric",
          month: "long"
        }).format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
